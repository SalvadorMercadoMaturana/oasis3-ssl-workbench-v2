name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[analysis,tuning,toolkit]" pytest ruff
      - name: Lint
        run: ruff check src tests scripts tools/dataset_oasis3/scripts
      - name: Test
        run: pytest
      - name: Smoke checks (no training and no private data)
        run: python tools/dataset_oasis3/scripts/quick_start.py --check
