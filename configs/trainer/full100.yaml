# @package trainer
# Same protocol as full50.yaml (early stopping, health checks, checkpoint
# cadence) but with the epoch ceiling raised for the GPU campaign. Leave
# accelerator/devices on "auto" so a CUDA GPU (e.g. a rented RTX 4090) is
# picked up automatically; no override needed on a GPU host.
max_epochs: 100
max_steps: -1
accelerator: "auto"
devices: "auto"
precision: "32-true"
log_every_n_steps: 10
# "warn" instead of true: DINOv2's ViT interpolates its positional embedding
# with bicubic upsampling (src/t5_ssl/models/backbones/vit.py) to match the
# local-crop grid size, and upsample_bicubic2d's CUDA backward has no
# deterministic implementation — strict determinism makes that a hard
# RuntimeError the instant DINOv2 trains on a GPU (never hit on CPU, where
# full50/full100 were validated before). "warn" keeps determinism everywhere
# else and only downgrades this one unavoidable op to a warning.
deterministic: "warn"
enable_checkpointing: true
enable_progress_bar: true
limit_train_batches: 1.0
limit_val_batches: 1.0
early_stopping_patience: 10
early_stopping_min_delta: 0.001
enable_health_check: true
health_check_every_n_epochs: 5
checkpoint_every_n_epochs: 5
checkpoint_weights_only: true  # false = keep optimizer state (needed only to resume via ckpt_path)
