# @package data
# Hippocampal 3D ROI cubes (see src/t5_ssl/data/roi3d.py): one cube per
# hemisphere around the population-mean hippocampal centroid, stored as two
# channels [left, right mirrored]. roi_size 32 -> 64 mm (2 mm voxels);
# 48 -> 96 mm. Build the cache with `python scripts/legacy/run_roi3d.py preprocess`.
source: roi3d
csv_path: ${oc.env:OASIS3_CSV,data/dementia/mni-dataset.csv}
manifest_path: campaign_full50_pretrained_balanced/train_sessions_eval_primary_balanced.csv
roi_size: 32
cache_path: data/roi3d/hippo_s${data.roi_size}.npy
channels: 2
one_session_per_subject_train: true
batch_size: 16
num_workers: 0
pin_memory: false
seed: 42
