# @package data
# 270-subject group-stratified cohort (AD/HC/OTHER), ~28% of the full 981-subject
# pool, generated by scripts/select_representative_subjects.py --fraction 0.275
# --seed 42. Mirrors oasis3_full50's sampling policy (one random train session
# per subject per epoch) at a size that fits a same-day anti-collapse check
# instead of the full multi-hour campaign.
source: lmdb
csv_path: ${oc.env:OASIS3_CSV,data/dementia/mni-dataset.csv}
lmdb_path: ${oc.env:OASIS3_LMDB,data/dementia/mni-dataset.lmdb}
manifest_path: ${oc.env:OASIS3_REPRESENTATIVE270_MANIFEST,representative_oasis3_270.csv}
primary_only: false
one_session_per_subject_train: true
train_cache_capacity: 500
batch_size: 16
num_workers: 0
pin_memory: false
channels: 1
slices_per_volume: 1
slice_range: [0.30, 0.70]
train_ratio: 0.70
val_ratio: 0.15
seed: 42
