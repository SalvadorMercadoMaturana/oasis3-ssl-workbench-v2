[project]
name = "t5-ssl"
version = "0.1.0"
description = "Cohesive OASIS3 dataset toolkit and self-supervised learning workbench"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "jintriago" }]
keywords = ["self-supervised-learning", "medical-imaging", "oasis3", "pytorch", "lightning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "lightning>=2.1",
    "nibabel>=5.0",
    "lmdb>=1.4",
    "numpy>=1.24",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "torchmetrics>=1.0.0",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "PyYAML>=6"]
tuning = ["optuna>=4", "matplotlib>=3.7", "PyYAML>=6"]
toolkit = [
    "jupyterlab>=3",
    "matplotlib>=3.7",
    "pandas>=1.5",
    "scikit-image>=0.20",
]

[project.scripts]
t5-ssl = "t5_ssl.cli:main"
t5-ssl-train = "t5_ssl.train:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t5_ssl"]

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstring
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "D107",   # missing docstring in __init__ (documented in class docstring)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    "N812",   # lowercase imported as non-lowercase (e.g. F, L)
    "D102",   # Lightning/PyTorch method names are self-describing
    "D103",   # standalone research scripts favor module-level documentation
    "D105",   # standard Python data-model methods do not need repeated docs
    "E501",   # long scientific labels and report strings are clearer intact
    "RUF001", # intentional Spanish scientific symbols such as ×, σ and −
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that download the full dataset (deselect with '-m \"not slow\"')",
]
addopts = "-v --tb=short"
